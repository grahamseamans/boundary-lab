[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "boundary-lab"
version = "0.5.0.dev0"
description = "Boundary element loudspeaker radiation solver"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beat-engine @ https://github.com/grahamseamans/BEAT_Engine/releases/download/v0.3.0-ti2/beat_engine-0.3.0%2Bti2-py3-none-any.whl#sha256=69905d7353b7bbc132ec6d01d6eba465c77b8d65b42b0be508d860604d5bf111",
  "gmsh",
  "matplotlib",
  "meshio",
  "numpy",
  "scipy",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff>=0.15,<0.16",
]
gui = [
  "PySide6",
  "pyvista>=0.47",
  "pyvistaqt",
]

[project.scripts]
blab = "blab.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/blab"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests", "scripts"]
force-exclude = true
extend-exclude = [
  "ath/",
  "runs/",
  "references/",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/benchmark_gui_pipeline.py" = ["E402"]
